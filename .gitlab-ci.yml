stages:
  - pre_check
  - build
  - test
  - docs

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: always

variables:
    CI_DOCKER_REGISTRY: "ciregistry.espressif.cn:8443"
    ESP_THREAD_BR_PATH: "$CI_PROJECT_DIR"
    CI_TOOLS_PATH: "$CI_PROJECT_DIR/tools/ci"
    ESP_ENV_IMAGE: "${CI_REGISTRY}/ci/images/idf-v6.2:2"
    # Same image used by the OpenThread BR target tests that run pytest_otbr.py.
    TARGET_TEST_ENV_IMAGE: "${CI_REGISTRY}/ci/images/idf-v6.2-target-test:2"
    ESP_IDF_HTTP: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${ESP_GITLAB}/espressif/esp-idf.git"

.submodule_update: &submodule_update
  - cd $ESP_THREAD_BR_PATH
  - git submodule update --init --recursive

.setup_idf: &setup_idf
  - cd $CI_PROJECT_DIR
  - git clone --depth=1 -b $CI_COMMIT_REF_NAME ${ESP_IDF_HTTP} || git clone --depth=1 -b master ${ESP_IDF_HTTP}
  - cd esp-idf
  - git submodule update --init --depth=1
  - ./install.sh
  - . ./export.sh

.setup_idf_master: &setup_idf_master
  - cd $CI_PROJECT_DIR
  - git clone --depth=1 -b master ${ESP_IDF_HTTP}
  - cd esp-idf
  - git submodule update --init --depth=1
  - ./install.sh
  - . ./export.sh

.setup_idf_v55: &setup_idf_v55
  - cd $CI_PROJECT_DIR
  - git clone --depth=1 -b release/v5.5 ${ESP_IDF_HTTP}
  - cd esp-idf
  - git submodule update --init --depth=1
  - ./install.sh
  - . ./export.sh

.build_basic_thread_border_router: &build_basic_thread_border_router
  - cd $IDF_PATH/examples/openthread/ot_rcp
  - idf.py set-target esp32h2
  - git rev-parse HEAD
  - idf.py build
  - cd $ESP_THREAD_BR_PATH/examples/basic_thread_border_router
  - git fetch origin main
  - python3 $ESP_THREAD_BR_PATH/example_build_version_check.py basic_thread_border_router esp_ot_cli_extension
  - python3 $ESP_THREAD_BR_PATH/example_build_version_check.py basic_thread_border_router esp_rcp_update
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/basic_thread_border_router.cmake CMakeLists.txt
  - idf.py build

# Same firmware as the basic border router build, with the REST/Web server enabled.
.build_br_host_rest_firmware: &build_br_host_rest_firmware
  - cd $IDF_PATH/examples/openthread/ot_rcp
  - idf.py set-target esp32h2
  - git rev-parse HEAD
  - idf.py build
  - cd $ESP_THREAD_BR_PATH/examples/basic_thread_border_router
  - git fetch origin main
  - python3 $ESP_THREAD_BR_PATH/example_build_version_check.py basic_thread_border_router esp_ot_cli_extension
  - python3 $ESP_THREAD_BR_PATH/example_build_version_check.py basic_thread_border_router esp_rcp_update
  - echo "CONFIG_OPENTHREAD_BR_START_WEB=y" >> sdkconfig.defaults
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/basic_thread_border_router.cmake CMakeLists.txt
  - idf.py build

.build_m5stack_thread_border_router: &build_m5stack_thread_border_router
  - cd $IDF_PATH/examples/openthread/ot_rcp
  - idf.py set-target esp32h2
  - git rev-parse HEAD
  - idf.py build
  - cd $ESP_THREAD_BR_PATH/examples/m5stack_thread_border_router
  - git fetch origin main
  - python3 $ESP_THREAD_BR_PATH/example_build_version_check.py m5stack_thread_border_router esp_ot_cli_extension
  - python3 $ESP_THREAD_BR_PATH/example_build_version_check.py m5stack_thread_border_router esp_rcp_update
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/basic_thread_border_router.cmake CMakeLists.txt
  - idf.py build

.build_local_components: &build_local_components
  - cd $IDF_PATH/examples/openthread/ot_rcp
  - idf.py set-target esp32h2
  - git rev-parse HEAD
  - idf.py build

  - cd $ESP_THREAD_BR_PATH/examples/basic_thread_border_router
  - echo "CONFIG_CREATE_OTA_IMAGE_WITH_RCP_FW=y" >> sdkconfig.defaults
  - rm -rf main/idf_component.yml
  - cp ${CI_TOOLS_PATH}/idf_component_local.yml main/idf_component.yml
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/basic_thread_border_router.cmake CMakeLists.txt
  - idf.py build

.build_idf_example_ot_br: &build_idf_example_ot_br
  - cd $ESP_THREAD_BR_PATH
  - git fetch origin main
  - python3 example_build_version_check.py ot_br esp_ot_cli_extension
  - cd $IDF_PATH/examples/openthread/ot_br
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/ot_br.cmake CMakeLists.txt
  - idf.py set-target esp32s3
  - idf.py build
  - idf.py set-target esp32c6
  - idf.py build

.build_idf_example_ot_br_autostart: &build_idf_example_ot_br_autostart
  - cd $ESP_THREAD_BR_PATH
  - git fetch origin main
  - python3 example_build_version_check.py ot_br esp_ot_cli_extension
  - cd $IDF_PATH/examples/openthread/ot_br
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/ot_br.cmake CMakeLists.txt
  - rm -rf sdkconfig.defaults
  - cp ${CI_TOOLS_PATH}/sdkconfig.br.autostart sdkconfig.defaults
  - idf.py set-target esp32s3
  - idf.py build
  - idf.py set-target esp32c6
  - idf.py build

.build_idf_example_ot_cli: &build_idf_example_ot_cli
  - cd $ESP_THREAD_BR_PATH
  - git fetch origin main
  - python3 example_build_version_check.py ot_cli esp_ot_cli_extension
  - cd $IDF_PATH/examples/openthread/ot_cli
  - rm -rf CMakeLists.txt
  - cp ${CI_TOOLS_PATH}/ot_cli.cmake CMakeLists.txt
  - idf.py set-target esp32c6
  - idf.py build
  - idf.py set-target esp32h2
  - idf.py build

build_examples:
    stage: build
    image: espressif/idf:latest
    script:
        - *submodule_update
        - *build_basic_thread_border_router
    tags:
        - build

build_br_host_rest:
    stage: build
    image: espressif/idf:latest
    script:
        - *submodule_update
        - *build_br_host_rest_firmware
    artifacts:
        paths:
            - examples/basic_thread_border_router/build/flasher_args.json
            - examples/basic_thread_border_router/build/flash_args
            - examples/basic_thread_border_router/build/project_description.json
            - examples/basic_thread_border_router/build/sdkconfig
            - examples/basic_thread_border_router/build/**/*.bin
        expire_in: 1 day
    tags:
        - build

build_examples_m5stack:
    stage: build
    image: $CI_DOCKER_REGISTRY/esp-env-v5.5:3
    script:
        - *submodule_update
        - *setup_idf_v55
        - *build_m5stack_thread_border_router
    tags:
        - build

build_examples_local_components:
    stage: build
    image: $ESP_ENV_IMAGE
    script:
        - *submodule_update
        - *setup_idf
        - *build_local_components
    tags:
        - build

build_idf_otbr_examples:
    stage: build
    image: $ESP_ENV_IMAGE
    script:
        - *setup_idf_master
        - *build_idf_example_ot_br
    tags:
        - build

build_idf_otbr_autostart_examples:
    stage: build
    image: $ESP_ENV_IMAGE
    script:
        - *setup_idf_master
        - *build_idf_example_ot_br_autostart
    tags:
        - build

build_idf_otcli_examples:
    stage: build
    image: $ESP_ENV_IMAGE
    script:
        - *setup_idf_master
        - *build_idf_example_ot_cli
    tags:
        - build

build_docs:
    stage: build
    image: $CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.1:1-1
    variables:
        ESP_DOCS_LATEST_BRANCH_NAME: "main"
    artifacts:
        when: always
        paths:
            - docs/_build/*/*/*.txt
            - docs/_build/*/*/html/*
        expire_in: 1 days
    script:
        - cd docs
        - pip install -r requirements.txt
        - build-docs -l en
    tags:
        - build_docs

host_rest_tests:
    stage: test
    image:
        name: espressif/idf:latest
        entrypoint: [""]
    tags:
        - build
    # Host tests do not use firmware artifacts, so do not wait for the build stage.
    needs: []
    before_script:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates clang curl unzip
        # IDF >= 6 does not bundle cJSON. Fetch the same ^1.7.19 component the firmware uses.
        - |
          idf_path="${IDF_PATH:-/opt/esp/idf}"
          if [ -f "${idf_path}/components/json/cJSON/cJSON.c" ]; then
            echo "Using cJSON bundled with ESP-IDF"
          else
            cjson_dir="${CI_PROJECT_DIR}/.cjson"
            mkdir -p "${cjson_dir}"
            curl -fsSL --retry 3 --max-time 180 -o "${cjson_dir}/cjson.zip" \
              "https://components-file.espressif.com/components/espressif/cjson/1.7.19~2/espressif__cjson-v1.7.19_2.zip"
            echo "2e13f18fa612d85eeec4001dee87b246beac64cf019bc28d4c4e2e1910adc7f1  ${cjson_dir}/cjson.zip" | sha256sum -c -
            unzip -q -o "${cjson_dir}/cjson.zip" -d "${cjson_dir}"
            test -f "${cjson_dir}/cJSON/cJSON.c"
            export CJSON_PATH="${cjson_dir}/cJSON"
          fi
    script:
        - . /opt/esp/idf/export.sh
        - python3 components/esp_ot_br_server/tests/run_host_tests.py

# Form-network always runs. The webui case runs in the same job when the merge
# request has the webui label, when any file in esp_ot_br_server differs from
# the MR target branch, or when a default-branch commit changes that component
# relative to the previous commit. Do not compare a default-branch pipeline to
# refs/heads/main: that ref is the commit under test, so the diff is empty and
# Web UI changes fall back to "not webui". changes without if matches on new
# branches and tags.
.webui_change_paths: &webui_change_paths
    - components/esp_ot_br_server/**/*

pytest_br:
    stage: test
    image: $TARGET_TEST_ENV_IMAGE
    tags:
        - pytest
        - esp-thread-br
    resource_group: esp-thread-br
    needs:
        - job: build_br_host_rest
          artifacts: true
    variables:
        PYTEST_BR_MARK: "not webui"
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)webui(,|$)/
          variables:
              PYTEST_BR_MARK: "webui or not webui"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              paths: *webui_change_paths
              compare_to: refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
          variables:
              PYTEST_BR_MARK: "webui or not webui"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes:
              paths: *webui_change_paths
              compare_to: $CI_COMMIT_BEFORE_SHA
          variables:
              PYTEST_BR_MARK: "webui or not webui"
        - when: on_success
    script:
        - cd examples/basic_thread_border_router
        - pytest "$CI_PROJECT_DIR/components/esp_ot_br_server/tests/pytest_br.py" -m "$PYTEST_BR_MARK" --target esp32s3 --embedded-services esp,idf -s --log-cli-level=INFO

.deploy_docs_template:
    stage: docs
    image: $CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.1:1-1
    needs:
        - build_docs
    variables:
        ESP_DOCS_LATEST_BRANCH_NAME: "main"
    script:
        - source ${CI_PROJECT_DIR}/docs/utils.sh
        - add_doc_server_ssh_keys $DOCS_DEPLOY_PRIVATEKEY $DOCS_DEPLOY_SERVER $DOCS_DEPLOY_SERVER_USER
        - export GIT_VER=$(git describe --always)
        - pip install -r ${CI_PROJECT_DIR}/docs/requirements.txt
        - deploy-docs
    tags:
        - deploy

deploy_docs_preview:
    extends:
        - .deploy_docs_template
    except:
        - main
        - /^release\/v/
        - /^v\d+\.\d+/
    variables:
        TYPE: "preview"
        DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
        DOCS_DEPLOY_PATH: "$DOCS_PREVIEW_PATH"
        DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PREVIEW_DEPLOY_KEY"
        DOCS_DEPLOY_SERVER: "$DOCS_PREVIEW_SERVER"
        DOCS_DEPLOY_SERVER_USER: "$DOCS_PREVIEW_SERVER_USER"
        DOCS_DEPLOY_URL_BASE: "https://$DOCS_PREVIEW_SERVER/projects/esp-thread-br"

deploy_docs_production:
    extends:
        - .deploy_docs_template
    only:
        - main
        - /^release\/v/
        - /^v\d+\.\d+/
    variables:
        TYPE: "preview"
        DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
        DOCS_DEPLOY_PATH: "$DOCS_PROD_PATH"
        DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PROD_DEPLOY_KEY"
        DOCS_DEPLOY_SERVER: "$DOCS_PROD_SERVER"
        DOCS_DEPLOY_SERVER_USER: "$DOCS_PROD_SERVER_USER"
        DOCS_DEPLOY_URL_BASE: "https://docs.espressif.com/projects/esp-thread-br"

include:
  - '.gitlab/ci/pre_commit.yml'