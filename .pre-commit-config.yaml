# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v14.0.6'  # Use the sha / tag you want to point at
    hooks:
    - id: clang-format
      exclude: "examples/common/thread_border_router_m5stack/image/.*"

  - repo: local
    hooks:
      - id: check-version-increment
        name: Check Version Increment in Specific idf_component.yml
        entry: bash -c "export ESP_THREAD_BR_PATH=$(pwd) && python3 precommit_version_check.py"
        language: python
        additional_dependencies: [pyyaml]

  - repo: local
    hooks:
      - id: check-rest-api-version-sync
        name: Check REST API version is in sync between esp_br_web_api.h and openapi.yaml
        entry: python3 tools/ci/check_rest_api_version_sync.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: '^components/esp_ot_br_server/(private_include/esp_br_web_api\.h|src/openapi\.yaml)$'

  - repo: local
    hooks:
      - id: codespell
        name: Check typos with codespell
        entry: bash tools/check_typos.sh
        language: system
        pass_filenames: true
