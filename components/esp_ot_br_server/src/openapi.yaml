          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created a dataset.
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveDataset'
          text/plain:
            schema:
              $ref: '#/components/schemas/DatasetTlvs'
      parameters:
      - name: If-None-Match
        in: header
        schema:
          type: string
          enum:
          - '*'
        description: Write only when no dataset exists.
    options:
      summary: List supported methods
      responses:
        '200':
          description: Allowed methods.
          headers:
            Allow:
              schema:
                type: string
        '404':
