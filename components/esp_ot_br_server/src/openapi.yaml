openapi: 3.0.3
info:
  title: ESP Thread Border Router REST API
  version: 2.0.0
  description: Thread REST endpoints compatible with the ot-br-posix REST API 0.6.0 contract. Enable CONFIG_OPENTHREAD_BR_START_WEB
    to serve these endpoints on port 80. Structured JSON uses lower camel case. Request bodies are limited to 16
    KiB; each volatile collection holds up to 200 items.
  license:
    name: Apache-2.0
    url: https://github.com/espressif/esp-thread-br/blob/main/LICENSE
servers:
- url: http://esp-ot-br.local:80
paths:
  /node:
    get:
      summary: Read /node
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Erase persistent Thread configuration and restart
      responses:
        '200':
          description: Success
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      summary: List supported methods
      responses:
        '200':
          description: Allowed methods.
          headers:
            Allow:
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /node/ba-id:
    get:
      summary: Read /node/ba-id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: &id005
