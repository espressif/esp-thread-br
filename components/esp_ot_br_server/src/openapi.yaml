          text/plain:
            schema:
              $ref: '#/components/schemas/DatasetTlvs'
      parameters:
      - name: If-None-Match
        in: header
        schema:
          type: string
          enum:
          - '*'
        description: Write only when no dataset exists.
      description: Register with the Thread leader. JSON requires activeDataset and delay. The HTTP request waits
