components:
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
      required:
      - status
      - title
    Timestamp:
      type: object
      properties:
        seconds:
          type: integer
          minimum: 0
          maximum: 281474976710655
        ticks:
          type: integer
          minimum: 0
          maximum: 32767
        authoritative:
          type: boolean
    SecurityPolicy:
      type: object
      properties:
        rotationTime:
          type: integer
          minimum: 0
          maximum: 65535
        obtainNetworkKey:
          type: boolean
        nativeCommissioning:
          type: boolean
        routers:
          type: boolean
        externalCommissioning:
          type: boolean
        commercialCommissioning:
          type: boolean
        autonomousEnrollment:
          type: boolean
        networkKeyProvisioning:
          type: boolean
        tobleLink:
          type: boolean
        nonCcmRouters:
          type: boolean
    ActiveDataset:
      type: object
      properties:
        activeTimestamp:
          $ref: '#/components/schemas/Timestamp'
        networkKey: *id005
        networkName:
          type: string
          maxLength: 16
        extPanId: *id001
        meshLocalPrefix:
          type: string
          example: fd00::/64
        panId:
          type: integer
          minimum: 0
          maximum: 65535
        channel:
          type: integer
        pskc: *id005
        securityPolicy:
          $ref: '#/components/schemas/SecurityPolicy'
        channelMask:
          type: integer
          minimum: 0
          maximum: 4294967295
    PendingDataset:
      type: object
      properties:
        activeDataset:
          oneOf:
          - $ref: '#/components/schemas/ActiveDataset'
          - $ref: '#/components/schemas/DatasetTlvs'
        pendingTimestamp:
          $ref: '#/components/schemas/Timestamp'
        delay:
          type: integer
          minimum: 0
          maximum: 4294967295
      required:
      - activeDataset
      - delay
    DatasetTlvs:
      type: string
      pattern: ^([0-9a-fA-F]{2})*$
    LeaderData:
      type: object
      properties:
        partitionId:
          type: integer
        weighting:
          type: integer
        dataVersion:
          type: integer
        stableDataVersion:
          type: integer
        leaderRouterId:
          type: integer
    Node:
      type: object
      properties:
        baId: *id005
        baState:
          type: string
        state:
          type: string
          enum:
          - disabled
          - detached
          - child
          - router
          - leader
        routerCount:
          type: integer
        rlocAddress:
          type: string
          format: ipv6
        extAddress: *id001
        networkName:
          type: string
        rloc16:
          type: string
          pattern: ^0x[0-9a-f]{4}$
        routerId:
          type: integer
        leaderData:
          $ref: '#/components/schemas/LeaderData'
        extPanId: *id001
    Mode:
      type: object
      properties:
        rxOnWhenIdle:
          type: boolean
        fullThreadDevice:
          type: boolean
        fullNetworkData:
          type: boolean
    Joiner:
      type: object
      properties:
        pskd:
          type: string
          minLength: 6
          maxLength: 32
        joinerId:
          type: string
        eui: *id001
        discerner:
          type: string
          example: 0x0000000000000001/16
        timeout:
          type: integer
          default: 60
      required:
      - pskd
    EpskcStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - disabled
          - stopped
          - started
          - connected
          - accepted
        port:
          type: integer
      required:
      - state
      - port
    EpskcActivation:
      type: object
      properties:
        lifetime:
          type: integer
          minimum: 0
          maximum: 600000
          description: Milliseconds; zero selects the OpenThread default.
        port:
          type: integer
          minimum: 0
          maximum: 65535
          default: 0
    EpskcKey:
      type: object
      properties:
        tap:
          type: string
          pattern: ^[0-9]{9}$
        port:
          type: integer
      required:
      - tap
      - port
    Discovery:
      type: object
      properties:
        api:
          type: object
          properties:
            version:
              type: string
            base:
              type: string
          required:
          - version
          - base
        links:
          type: array
          items:
            type: object
            properties:
              href:
                type: string
              rel:
                type: string
              type:
                type: array
                items:
                  type: string
            required:
            - href
            - rel
            - type
      required:
      - api
      - links
    CollectionMeta:
      type: object
      properties:
        collection:
          type: object
          properties:
            offset:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            pending:
              type: integer
    addThreadDeviceTask:
      type: object
      properties:
        type:
          type: string
          enum:
          - addThreadDeviceTask
        attributes:
          $ref: '#/components/schemas/Joiner'
      required:
      - type
      - attributes
    updateDeviceCollectionTask:
      type: object
      properties:
        type:
          type: string
          enum:
          - updateDeviceCollectionTask
        attributes:
          type: object
          properties:
            maxAge:
              type: number
            maxRetries:
              type: integer
            deviceCount:
              type: integer
            timeout: &id006
              type: number
              description: Action deadline in seconds.
          required:
          - maxAge
          - maxRetries
          - deviceCount
          - timeout
      required:
      - type
      - attributes
    getNetworkDiagnosticTask:
      type: object
      properties:
        type:
          type: string
          enum:
          - getNetworkDiagnosticTask
        attributes:
          type: object
          properties:
            destination: &id007
              type: string
              description: Extended address, ML-EID IID, or RLOC16.
            destinationType: &id008
              type: string
              enum:
              - extended
              - mleid
              - rloc
            types:
              type: array
              items:
                type: string
                enum:
                - extAddress
                - rloc16
                - mode
                - timeout
                - connectivity
                - route
                - leaderData
                - networkData
                - ipv6Addresses
                - macCounters
                - batteryLevel
                - supplyVoltage
                - childTable
                - channelPages
                - maxChildTimeout
                - lDevIdSubject
                - iDevIdCert
                - eui
                - threadVersion
                - vendorName
                - vendorModel
                - vendorSwVersion
                - threadStackVersion
                - children
                - childIpv6Addresses
                - routerNeighbors
                - mleCounters
            timeout: *id006
          required:
          - destination
          - types
          - timeout
      required:
      - type
      - attributes
    resetNetworkDiagCounterTask:
      type: object
      properties:
        type:
          type: string
          enum:
          - resetNetworkDiagCounterTask
        attributes:
          type: object
          properties:
            destination: *id007
            destinationType: *id008
            types:
              type: array
              items:
                type: string
                enum:
                - macCounters
                - mleCounters
            timeout: *id006
          required:
          - types
          - timeout
      required:
      - type
      - attributes
    getEnergyScanTask:
      type: object
      properties:
        type:
          type: string
          enum:
          - getEnergyScanTask
        attributes:
          type: object
          properties:
            destination: *id007
            destinationType: *id008
            channelMask:
              type: array
              items:
                type: integer
                minimum: 11
                maximum: 26
            count:
              type: integer
            period:
              type: integer
            scanDuration:
              type: integer
            timeout: *id006
          required:
          - destination
          - channelMask
          - count
          - period
          - scanDuration
          - timeout
      required:
      - type
      - attributes
    ActionRequest:
      type: object
      properties:
        data:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/addThreadDeviceTask'
            - $ref: '#/components/schemas/updateDeviceCollectionTask'
            - $ref: '#/components/schemas/getNetworkDiagnosticTask'
            - $ref: '#/components/schemas/resetNetworkDiagCounterTask'
            - $ref: '#/components/schemas/getEnergyScanTask'
      required:
      - data
    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
      required:
      - id
      - type
      - attributes
    ResourceDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Resource'
      required:
      - data
    CollectionDocument:
      type: object
