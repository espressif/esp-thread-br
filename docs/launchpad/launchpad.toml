esp_toml_version = 1.0
firmware_images_url = "https://espressif.github.io/esp-thread-br/launchpad/"
config_readme_url = "https://espressif.github.io/esp-thread-br/launchpad/build_cfg.md"

supported_apps = ["basic_thread_border_router_8mb", "basic_thread_border_router_4mb", "m5stack_thread_border_router"]

[basic_thread_border_router_8mb]
chipsets = ["ESP32S3"]
image.esp32s3 = "basic_thread_border_router_8mb.bin"
description = "ESP Thread Border Router v1.2: 8MB flash, Web GUI and OTA."

[basic_thread_border_router_4mb]
chipsets = ["ESP32S3"]
image.esp32s3 = "basic_thread_border_router_4mb.bin"
description = "ESP Thread Border Router v1.2: 4MB flash, Web GUI, no OTA."

[m5stack_thread_border_router]
chipsets = ["ESP32S3"]
image.esp32s3 = "m5stack_thread_border_router.bin"
description = "M5Stack CoreS3 + ESP32-H2: touchscreen and Wi-Fi setup."
